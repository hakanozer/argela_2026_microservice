apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: argela-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: argela/inventory-service:latest
          imagePullPolicy: Never
          env:
            - name: ELASTICSEARCH_URIS
              value: http://elasticsearch:9200
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: argela-ms
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: argela-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: argela/order-service:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "argela123"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_DATASOURCE_URL
              value: jdbc:h2:file:/data/order-service;AUTO_SERVER=TRUE;
            - name: SPRING_DATASOURCE_USERNAME
              value: sa
            - name: SPRING_DATASOURCE_PASSWORD
              value: sa
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: order-data
              mountPath: /data
      volumes:
        - name: order-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: argela-ms
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
