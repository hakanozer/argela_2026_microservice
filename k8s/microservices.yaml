---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: argela-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: argela/api-gateway:latest
          imagePullPolicy: Never
          env:
            - name: GATEWAY_INVENTORY_URL
              value: http://inventory-service:8083
            - name: GATEWAY_ORDER_URL
              value: http://order-service:8081/order
            - name: GATEWAY_PAYMENT_URL
              value: http://payment-service:8082
            - name: GATEWAY_NOTIFICATION_URL
              value: http://notification-service:8084
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: argela-ms
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080

